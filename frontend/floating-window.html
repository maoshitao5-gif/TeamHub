<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamHub Floating</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      /* 关键：使用非透明背景色，但视觉上通过 body 背景实现透明效果 */
      background: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      /* 使用纯色背景配合 opacity 实现视觉透明 */
      background-color: rgba(0, 0, 0, 0.01);
    }

    #debug-status {
      position: fixed;
      top: 2px;
      left: 2px;
      font-size: 8px;
      padding: 2px 4px;
      background: rgba(255,255,255,0.95);
      border: 1px solid #999;
      border-radius: 2px;
      z-index: 9999;
      max-width: 76px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: #333;
    }

    .floating-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(10, 18, 36, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: grab;
      position: relative;
      overflow: hidden;
      user-select: none;
      -webkit-user-drag: none;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .floating-btn:hover {
      background: rgba(20, 30, 50, 0.95);
      border-color: rgba(100, 150, 255, 0.4);
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.5), 0 0 20px rgba(64, 150, 255, 0.2);
      transform: scale(1.05);
    }

    .floating-btn.drag-over {
      border-radius: 16px;
      background: #1a56db;
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 35px rgba(26, 86, 219, 0.6);
      transform: scale(1.1);
    }

    .floating-btn.moving {
      cursor: grabbing;
      opacity: 0.7;
    }

    .icon-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: all 0.2s ease;
    }

    .floating-btn.drag-over .icon-wrap {
      opacity: 0;
      transform: scale(0.5);
    }

    .icon-wrap svg {
      width: 26px;
      height: 26px;
      color: rgba(255, 255, 255, 0.95);
    }

    .drop-hint {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease 0.05s;
    }

    .floating-btn.drag-over .drop-hint { 
      opacity: 1; 
    }

    .drop-hint svg {
      width: 24px;
      height: 24px;
      color: rgba(255, 255, 255, 0.95);
    }

    .drop-hint-text {
      font-size: 9px;
      font-weight: 600;
      text-align: center;
      line-height: 1.3;
      color: rgba(255, 255, 255, 0.95);
    }

    .floating-btn.success {
      background: #16a34a;
      border-color: rgba(255, 255, 255, 0.3);
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
      50% { box-shadow: 0 4px 15px rgba(0,0,0,0.4), 0 0 0 4px rgba(64,150,255,0.15); }
    }

    .floating-btn.idle { 
      animation: pulse 3s ease-in-out infinite; 
    }
  </style>
</head>
<body>
  <div id="debug-status">INIT</div>
  <div class="floating-btn idle" id="floatingBtn">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="currentColor" opacity="0.2"/>
        <polyline points="14 2 14 8 20 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <line x1="12" y1="12" x2="12" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="9" y1="16" x2="15" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="drop-hint">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="17 8 12 3 7 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="12" y1="3" x2="12" y2="15" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div class="drop-hint-text">Drop Files</div>
    </div>
  </div>

  <!-- 脚本提取为外部文件，规避 CSP 对内联脚本的限制 -->
  <script src="./floating-window.js"></script>
</body>
</html>
