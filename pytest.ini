[pytest]
# pytest 配置文件

# 测试发现路径
testpaths = tests

# Python 文件匹配模式
python_files = test_*.py *_test.py

# Python 类匹配模式
python_classes = Test*

# Python 函数匹配模式
python_functions = test_*

# 输出选项
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# 标记定义
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests

# 异步测试配置
asyncio_default_fixture_loop_scope = function
