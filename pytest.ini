[pytest]
# pytest 配置文件

# 测试发现路径（M0 修正：真实测试位于 backend/tests，根目录 tests/ 不存在）
testpaths = backend/tests

# Python 文件匹配模式
python_files = test_*.py *_test.py

# Python 类匹配模式
python_classes = Test*

# Python 函数匹配模式
python_functions = test_*

# 输出选项
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# 标记定义
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests

# 异步测试配置
# M0 记录：pytest-asyncio 0.21.1 不支持 asyncio_default_fixture_loop_scope（0.24+ 引入），
# 引入异步测试时需先升级 pytest-asyncio 再恢复该选项
